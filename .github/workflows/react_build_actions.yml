name: React vite CI

on:
  push:
    branch:
      - main
  pull_request:
    branch:
      main

jobs:
  build:
    runs-on: ubuntu-latest

  steps:
    - name: descargar codigo
      uses: actions/checkout@v4

    - name: instalar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: instalar dependencias
      run: npm ci

    - name: construir la aplicación de js
      run: npm run build